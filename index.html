<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Credit — Demo</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
  body{font-family:Arial,sans-serif}
  .stage{
    position:relative;
    width:100vw;
    height:100svh;
    min-height:100vh;
    overflow:hidden;
    background:#000;
  }
  video.bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    display:block;
    background:#000;
  }
  .shade{
    position:absolute;
    inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,0) 45%,rgba(0,0,0,.25));
    pointer-events:none;
  }
  .enter{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    background:rgba(0,0,0,.28);
    backdrop-filter:blur(2px);
    transition:opacity .7s ease;
    z-index:5;
  }
  .enter.hide{opacity:0;pointer-events:none}
  button{
    border:1px solid rgba(255,255,255,.7);
    background:rgba(0,0,0,.35);
    color:#fff;
    padding:14px 30px;
    border-radius:999px;
    font-size:14px;
    letter-spacing:.18em;
    cursor:pointer;
  }
  button:focus-visible{outline:2px solid #fff;outline-offset:4px}
  .yt{
    position:absolute;
    width:1px;height:1px;
    left:-10px;bottom:-10px;
    opacity:.01;
    pointer-events:none;
  }
  @media (orientation:portrait){
    video.bg{object-position:center}
  }
  @media (prefers-reduced-motion:reduce){
    .enter{transition:none}
  }
</style>
</head>
<body>
<main class="stage">
  <video class="bg" id="clip" src="kunnokz_ut1_team_clear.mp4"
         playsinline muted preload="auto" loop></video>
  <div class="shade"></div>

  <div class="enter" id="enter">
    <button id="start" type="button">ENTER</button>
  </div>

  <!-- YouTube player: music source requested by the user.
       Browsers may block autoplay with sound; starting from the ENTER click avoids that in most cases. -->
  <iframe class="yt" id="yt"
    src="https://www.youtube.com/embed/C0BG3B7aksU?enablejsapi=1&autoplay=0&controls=0&loop=1&playlist=C0BG3B7aksU"
    title="lulu. — Mrs. GREEN APPLE"
    allow="autoplay; encrypted-media; picture-in-picture"
    referrerpolicy="strict-origin-when-cross-origin"></iframe>
</main>

<script>
const clip = document.getElementById('clip');
const enter = document.getElementById('enter');
const start = document.getElementById('start');

start.addEventListener('click', () => {
  clip.muted = true;
  clip.currentTime = 0;
  clip.play().catch(() => {});
  enter.classList.add('hide');

  // Start the YouTube player after a real user interaction.
  const yt = document.getElementById('yt');
  yt.contentWindow.postMessage(JSON.stringify({
    event: 'command',
    func: 'playVideo',
    args: []
  }), '*');
});

// If the browser restores the page, keep the visual clip playing.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) clip.play().catch(() => {});
});
</script>
</body>
</html>
